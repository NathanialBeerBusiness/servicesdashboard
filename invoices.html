<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToxinResin - Invoices</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>ToxinResin Automation Dashboard</h1>
      <p>Invoices</p>
    </header>

    <nav class="tabs" aria-label="Dashboard pages">
      <a class="tab" href="customers.html">Customer Accounts</a>
      <a class="tab" href="jobs.html">Jobs</a>
      <a class="tab" href="service-reports.html">Service Reports</a>
      <a class="tab active" href="invoices.html">Invoices</a>
    </nav>

    <main>
      <section class="card">
        <h2>Invoices</h2>
        <form id="invoice-form" class="grid-form">
          <select name="customerId" required><option value="">Select customer</option></select>
          <input name="service" placeholder="Service summary" required />
          <input name="amount" type="number" min="0" step="0.01" placeholder="Amount" required />
          <textarea name="paymentInfo" placeholder="How to pay (bank details, terms)" required></textarea>
          <button type="submit">Create Invoice</button>
        </form>
        <div id="invoice-list" class="list"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
